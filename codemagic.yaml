# AniReel — Codemagic CI
#
# Development mode only (see docs/DECISIONS.md D2/D4):
# - Unsigned iOS Simulator build + unit tests on a cloud Mac.
# - No code signing, no App Store Connect, no TestFlight upload.
# Release mode (signing + TestFlight) will be added as a separate
# workflow once an App Store Connect API key exists.
workflows:
  ios-simulator-dev:
    name: AniReel iOS Simulator (unsigned dev)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: AniReel
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Install Metal Toolchain (Xcode 26 component, required to compile .metal files)
        script: xcodebuild -downloadComponent MetalToolchain
      - name: Generate placeholder art (icon/launch PNGs are generated, not stored in the repo snapshot)
        script: |
          python3 -m pip install --user pillow
          python3 scripts/make_placeholder_art.py
      - name: Fetch, convert and check the Core ML style models (docs/MODELS.md)
        # Official AnimeGANv3 Core ML models (non-commercial license), resized to the app's portrait
        # sizes. On this Mac every model is compared with the official ONNX output; a mismatch fails
        # the build, so the Simulator steps below always run the real, checked models.
        script: |
          set -e
          bash scripts/fetch_models.sh
          ls -l AniReel/Resources/Models
      - name: Generate Xcode project from project.yml
        script: |
          xcodegen generate
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild \
            -project AniReel.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            build
      - name: Run unit tests on an available iPhone simulator
        script: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          xcodebuild test \
            -project AniReel.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -skip-testing:AniReelUITests \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO
      - name: Record a demo video of the main flow (UI test in the Simulator)
        # A demo, not a gate: a failure shows on this step but does not fail the build.
        ignore_failure: true
        script: |
          # The recorder must be stopped even when the test fails, so failures are handled explicitly.
          set +e
          # Same pick as the unit-test step, so it is the same simulator.
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          OUT="${CM_WORKSPACE:-$CM_BUILD_DIR}/anireel-demo.mp4"
          echo "Using simulator UDID: $UDID, recording to $OUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          # Build first so the video starts at app launch, not during compilation.
          xcodebuild build-for-testing \
            -project AniReel.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO || exit 1
          PRODUCTS=$(xcodebuild -project AniReel.xcodeproj -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -showBuildSettings 2>/dev/null \
            | awk -F ' = ' '/ BUILT_PRODUCTS_DIR = /{print $2; exit}')
          xcrun simctl install "$UDID" "$PRODUCTS/AniReel.app"
          # Fresh guest quota (kept in the Keychain) and pre-granted add-only Photos access,
          # so the clip saves without a permission alert. The test still taps through one if shown.
          xcrun simctl keychain "$UDID" reset || true
          xcrun simctl privacy "$UDID" grant photos-add com.anireel.app || true

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT" &
          RECORDER=$!
          sleep 2
          xcodebuild test-without-building \
            -project AniReel.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -only-testing:AniReelUITests \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO
          STATUS=$?
          sleep 1
          kill -INT "$RECORDER"
          wait "$RECORDER"
          ls -lh "$OUT"
          exit $STATUS
    artifacts:
      - $CM_WORKSPACE/anireel-demo.mp4
      - anireel-demo.mp4
